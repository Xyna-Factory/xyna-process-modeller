<div class="area-wrapper" xc-i18n-context="datatype">
  <div class="exceptiontype-header">
    <type-info-area xc-i18n-context="type-info-area"
      [typeInfoArea]="exceptionType.typeInfoArea"
      (triggerAction)="performModellingAction($event)"
      [documentModel]="document"
      [showConverterButton]="true"
      [showBaseTypeAutocomplete]="true"
      [showAbstractCheckbox]="true"
     />
    <exception-messages-area xc-i18n-context="exception-messages-area"
      [exceptionMessagesArea]="exceptionType.exceptionMessageArea"
      (triggerAction)="performModellingAction($event)"
      [documentModel]="document"
     />
  </div>

  <div class="exceptiontype-body">
    <section class="members">
      <!-- Datatype Details -->
      <div class="detail-items">
        <details-item icon="tb-exception" [detailsItem]="detailsItem" />
      </div>
      <!-- Inherited Variables -->
      @if (exceptionType.hasBaseType()) {
        <member-area
          xc-i18n-context="member-area"
          caption="Inherited Variables"
          [area]="exceptionType.inheritedVarsArea"
          (triggerAction)="performModellingAction($event)"
          [documentModel]="document"
          [allowAdd]="false"
          >
          <member-variable-area [memberVariableArea]="exceptionType.inheritedVarsArea"
            [selectedVariableId]="selectedVariable()?.id"
            (triggerAction)="performModellingAction($event)"
            [documentModel]="document"
           />
        </member-area>
      }
      <!-- Member Variables -->
      <member-area
        xc-i18n-context="member-area"
        caption="Member Variables"
        [area]="exceptionType.memberVarsArea"
        (added)="addMemberVariable()"
        (triggerAction)="performModellingAction($event)"
        [documentModel]="document"
        >
        <member-variable-area [memberVariableArea]="exceptionType.memberVarsArea"
          [selectedVariableId]="selectedVariable()?.id"
          (triggerAction)="performModellingAction($event)"
          [documentModel]="document"
         />
      </member-area>
    </section>

    <section class="details">
      @if (selectedDetailsItem()) {
        <exceptiontype-details xc-i18n-context="exceptiontype-details"
          [exceptionType]="exceptionType"
          [detailsItem]="selectedDetailsItem()"
          (triggerAction)="performModellingAction($event)"
          [documentModel]="document"
         />
      }
      @if (selectedVariable()) {
        <member-variable-details xc-i18n-context="member-variable-details"
          [memberVariable]="selectedVariable()"
          (triggerAction)="performModellingAction($event)"
          [documentModel]="document"
         />
      }
    </section>
  </div>

  <!-- enforce loading style sheet of drop-indicator-->
  <drop-indicator />
</div>
